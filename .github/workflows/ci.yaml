name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.2.*']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Require Symfony ${{ matrix.symfony }}
        run: composer require --no-update symfony/config:${{ matrix.symfony }} symfony/dependency-injection:${{ matrix.symfony }} symfony/http-foundation:${{ matrix.symfony }} symfony/http-kernel:${{ matrix.symfony }} symfony/security-core:${{ matrix.symfony }} symfony/uid:${{ matrix.symfony }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
